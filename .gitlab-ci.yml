stages:
  - test
  - deploy

variables:
  AI_TEST_HEADLESS: "true"
  AI_TEST_BROWSER: "chromium"

# Test stage
ai-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  
  before_script:
    - npm ci
    - npx playwright install chromium
  
  script:
    - npx ai-test run "tests/**/*.test.ts"
  
  artifacts:
    when: always
    paths:
      - ai-test-results/
    reports:
      junit: ai-test-results/junit.xml
    expire_in: 30 days
  
  coverage: '/Pass Rate: (\d+\.?\d*)%/'
  
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# Generate test report page
pages:
  stage: test
  needs: [ai-tests]
  
  script:
    - mkdir -p public
    - cp -r ai-test-results/* public/
  
  artifacts:
    paths:
      - public
    expire_in: 30 days
  
  only:
    - main

# Deployment with test gate
deploy-staging:
  stage: deploy
  needs: [ai-tests]
  
  script:
    - echo "✅ Tests passed - deploying to staging"
    # Add your staging deployment commands here
  
  environment:
    name: staging
    url: https://staging.example.com
  
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success

deploy-production:
  stage: deploy
  needs: [ai-tests]
  
  script:
    - echo "✅ Tests passed - deploying to production"
    # Add your production deployment commands here
  
  environment:
    name: production
    url: https://example.com
  
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual  # Require manual approval for production
  
  # Only deploy if tests pass
  dependencies:
    - ai-tests

# Optional: Deployment validation
validate-deployment:
  stage: deploy
  needs: [deploy-production]
  
  script:
    - echo "Running post-deployment validation tests"
    - npx ai-test run "tests/smoke/**/*.test.ts"
  
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  
  allow_failure: false
